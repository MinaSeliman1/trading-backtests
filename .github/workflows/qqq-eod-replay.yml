name: QQQ EOD replay
on:
  push:
    branches: [main]
    paths:
      - 'bots/qqq-eod-replay/**'
      - '.github/workflows/qqq-eod-replay.yml'
  workflow_dispatch:
    inputs:
      initialize:
        description: 'One-time initialization before the first statistical date; rule 7 required'
        type: boolean
        default: false
  schedule:
    - cron: '23 17,18 * * 1-5'
      timezone: America/New_York
env:
  PYTHONTZPATH: ''
  PYTHONDONTWRITEBYTECODE: '1'
permissions:
  contents: read
  actions: read
concurrency:
  group: qqq-eod-replay-main
  cancel-in-progress: false
jobs:
  verify:
    name: Verify frozen replay
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.9'
          cache: pip
          cache-dependency-path: bots/qqq-eod-replay/requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r bots/qqq-eod-replay/requirements.txt
      - name: Test replay components
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m pytest bots/qqq-eod-replay/tests -q -p no:cacheprovider
      - name: Check inactive activation gate
        run: python bots/qqq-eod-replay/scripts/run_replay.py --mode status
      - name: Prepare public synthetic ciphertext
        run: python bots/qqq-eod-replay/scripts/cloud_smoke.py create --folder '${{ runner.temp }}/smoke'
      - name: Upload synthetic smoke artifact
        id: smoke
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: qqq-eod-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/smoke/state.enc
          retention-days: 1
          compression-level: 0
      - name: Verify real cloud download and decryption
        env:
          GH_TOKEN: ${{ github.token }}
        run: python bots/qqq-eod-replay/scripts/cloud_smoke.py verify --folder '${{ runner.temp }}/verification' --artifact-id '${{ steps.smoke.outputs.artifact-id }}'
  replay:
    name: Replay statistical ledger
    needs: verify
    if: github.ref == 'refs/heads/main' && vars.QQQ_EOD_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.9'
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r bots/qqq-eod-replay/requirements.txt
      - name: Read committed activation gate
        id: gate
        env:
          QQQ_EOD_ENABLED: ${{ vars.QQQ_EOD_ENABLED }}
        run: python bots/qqq-eod-replay/scripts/run_replay.py --mode status --github-output
      - name: Active generation checkpoint
        if: steps.gate.outputs.active == 'true'
        run: echo 'Reserved active generation checkpoint'
      - name: Evaluate registered sessions
        if: steps.gate.outputs.active == 'true'
        id: engine
        env:
          QQQ_EOD_ENABLED: ${{ vars.QQQ_EOD_ENABLED }}
          QQQ_INITIALIZE: ${{ inputs.initialize }}
          GH_TOKEN: ${{ github.token }}
          ALPACA_PAPER_KEY_ID: ${{ secrets.ALPACA_PAPER_KEY_ID }}
          ALPACA_PAPER_SECRET_KEY: ${{ secrets.ALPACA_PAPER_SECRET_KEY }}
          QQQ_EOD_STATE_KEY: ${{ secrets.QQQ_EOD_STATE_KEY }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python bots/qqq-eod-replay/scripts/run_replay.py --mode run
      - name: Persist encrypted state checkpoint
        if: always() && steps.engine.outputs.state_ready == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ${{ steps.engine.outputs.state_artifact }}
          path: ${{ runner.temp }}/qqq-eod-output/state.enc
          retention-days: 30
          if-no-files-found: error
          compression-level: 0
      - name: Publish derived simulation summary
        if: always() && steps.engine.outputs.state_ready == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: qqq-eod-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qqq-eod-output/summary.json
          retention-days: 30
          if-no-files-found: warn
